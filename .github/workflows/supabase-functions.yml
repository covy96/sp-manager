name: Pubblica funzioni notifiche

# Come nell'app Giulia (nido): a ogni merge su main che tocca le funzioni delle
# notifiche, GitHub le pubblica da solo su Supabase. Niente più deploy a mano.
#
# Serve UN segreto nel repository (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personale da https://supabase.com/dashboard/account/tokens
# Le chiavi delle notifiche Web Push (VAPID) le crea il workflow la prima volta e le
# salva solo nei segreti di Supabase: nessuno deve copiarle a mano.
# Senza SUPABASE_ACCESS_TOKEN il job viene saltato (non fallisce).
#
# Si può lanciare anche a mano: tab Actions → "Pubblica funzioni notifiche" → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/check-scadenze/**"
      - "supabase/functions/check-promemoria/**"
      - "supabase/functions/send-push-notification/**"
      - "database/web_push_dispositivi.sql"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Pubblica su Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rwysezttfgdicpvymeiw
    steps:
      - name: Controlla il segreto
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Segreto SUPABASE_ACCESS_TOKEN non impostato: pubblicazione saltata."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Chiavi Web Push (create solo la prima volta)
        if: steps.check.outputs.ready == 'true'
        run: |
          esistenti=$(supabase secrets list --project-ref "$PROJECT_REF")
          if echo "$esistenti" | grep -q "VAPID_PRIVATE_KEY" && echo "$esistenti" | grep -q "VAPID_PUBLIC_KEY"; then
            echo "Chiavi Web Push già presenti"
          else
            keys=$(npx -y web-push@3.6.7 generate-vapid-keys --json)
            pub=$(echo "$keys" | jq -r .publicKey)
            priv=$(echo "$keys" | jq -r .privateKey)
            echo "::add-mask::$priv"
            supabase secrets set --project-ref "$PROJECT_REF" \
              "VAPID_PUBLIC_KEY=$pub" "VAPID_PRIVATE_KEY=$priv" "VAPID_SUBJECT=mailto:noreply@sp-manager.app" > /dev/null
            echo "Chiavi Web Push create"
          fi
      # check-scadenze e check-promemoria sono chiamate dal cron con il CRON_SECRET
      # (non un login utente), quindi vanno pubblicate senza verifica JWT come oggi.
      - name: check-scadenze
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy check-scadenze --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: check-promemoria
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy check-promemoria --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: send-push-notification
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy send-push-notification --project-ref "$PROJECT_REF" --use-api --yes
